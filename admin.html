<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم ❤️</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8f1f5;
  color:#333;
}
.box{
  width:min(92%,600px);
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 8px 30px #0001;
}
h1{text-align:center}
input,textarea,button{
  width:100%;
  padding:13px;
  margin:7px 0 14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}
textarea{min-height:130px;resize:vertical}
button{
  background:#9b5577;
  color:white;
  border:0;
  cursor:pointer;
  font-weight:bold;
}
.hidden{display:none}
#result{
  margin-top:20px;
  padding:15px;
  background:#f5e9ef;
  border-radius:15px;
  word-break:break-all;
}
.file{
  background:#fafafa;
  padding:12px;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="box" id="loginBox">
  <h1>🔐 لوحة التحكم</h1>

  <input id="adminPass" type="password" placeholder="كلمة سر الإدارة">

  <button onclick="login()">دخول</button>
</div>


<div class="box hidden" id="adminBox">

  <h1>🎁 إنشاء هدية</h1>

  <label>كود الهدية</label>
  <input id="code" placeholder="مثال: ahmed01">

  <label>كلمة سر العميل</label>
  <input id="clientPassword" placeholder="كلمة السر التي سيدخل بها العميل">

  <label>عنوان الهدية</label>
  <input id="title" placeholder="إلى الشخص المميز ❤️">

  <label>تاريخ البداية</label>
  <input id="startDate" type="datetime-local">

  <label>الرسالة</label>
  <textarea id="message" placeholder="اكتبي الرسالة هنا..."></textarea>

  <div class="file">
    <label>📸 الصور</label>
    <input id="photos" type="file" accept="image/*" multiple>
  </div>

  <div class="file">
    <label>🎵 الأغنية</label>
    <input id="audio" type="file" accept="audio/*">
  </div>

  <div class="file">
    <label>🎬 الفيديو</label>
    <input id="video" type="file" accept="video/*">
  </div>

  <button id="saveBtn" onclick="saveGift()">
    تجهيز الهدية ❤️
  </button>

  <div id="result" class="hidden"></div>

</div>


<script>

const SUPABASE_URL =
"https://nuiemqobbetbpfaughik.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hJq2w7yXBvryhgpw9m1_hg_Tq4hzEBc";

const ADMIN_PASSWORD = "مريوم";


function login(){

  const p = document.getElementById("adminPass").value;

  if(p !== ADMIN_PASSWORD){
    alert("كلمة السر غلط");
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");
}


async function uploadFile(file, code){

  if(!file) return "";

  const safeName =
    Date.now() + "_" +
    Math.random().toString(36).slice(2) + "_" +
    file.name.replace(/[^\w.\-]/g,"_");

  const path = code + "/" + safeName;

  const response = await fetch(
    SUPABASE_URL +
    "/storage/v1/object/gift-files/" +
    encodeURIComponent(path),
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Content-Type":file.type || "application/octet-stream"
      },
      body:file
    }
  );

  if(!response.ok){

    const errorText = await response.text();

    throw new Error(
      "فشل رفع الملف: " + errorText
    );
  }

  return SUPABASE_URL +
    "/storage/v1/object/public/gift-files/" +
    path.split("/").map(encodeURIComponent).join("/");
}


async function saveGift(){

  const btn = document.getElementById("saveBtn");

  const code =
    document.getElementById("code").value.trim();

  const clientPassword =
    document.getElementById("clientPassword").value;

  const title =
    document.getElementById("title").value.trim();

  const startDate =
    document.getElementById("startDate").value;

  const message =
    document.getElementById("message").value.trim();

  const photoFiles =
    [...document.getElementById("photos").files];

  const audioFile =
    document.getElementById("audio").files[0];

  const videoFile =
    document.getElementById("video").files[0];


  if(!code){
    alert("اكتبي كود الهدية");
    return;
  }

  if(!clientPassword){
    alert("اكتبي كلمة سر العميل");
    return;
  }


  btn.disabled = true;
  btn.textContent = "جاري تجهيز الهدية...";


  try{

    /* رفع الصور */

    const photoUrls = [];

    for(const file of photoFiles){

      const url =
        await uploadFile(file,code);

      photoUrls.push(url);
    }


    /* رفع الأغنية */

    let audioUrl = "";

    if(audioFile){
      audioUrl =
        await uploadFile(audioFile,code);
    }


    /* رفع الفيديو */

    let videoUrl = "";

    if(videoFile){
      videoUrl =
        await uploadFile(videoFile,code);
    }


    const giftData = {

      code:code,

      password:clientPassword,

      title:title,

      start_date:
        startDate
        ? new Date(startDate).toISOString()
        : null,

      messages:JSON.stringify({

        text:message,

        photos:photoUrls,

        audio:audioUrl,

        video:videoUrl

      })

    };


    /* حفظ الهدية */

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/gift",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        },

        body:JSON.stringify(giftData)
      }
    );


    if(!response.ok){

      const error =
        await response.text();

      throw new Error(
        "فشل حفظ الهدية: " + error
      );
    }


    const link =
      location.origin +
      location.pathname.replace(
        "admin.html",
        ""
      ) +
      "?code=" +
      encodeURIComponent(code);


    const result =
      document.getElementById("result");

    result.classList.remove("hidden");

    result.innerHTML = `
      <strong>✅ الهدية اتجهزت</strong>
      <br><br>
      رابط العميل:
      <br>
      <a href="${link}" target="_blank">${link}</a>
      <br><br>
      <button onclick="navigator.clipboard.writeText('${link}')">
        📋 نسخ الرابط
      </button>
    `;


  }catch(error){

    alert(error.message);

  }finally{

    btn.disabled = false;
    btn.textContent = "تجهيز الهدية ❤️";

  }
}

</script>

</body>
   </html>
