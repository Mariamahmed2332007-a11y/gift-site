<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الهدايا</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8f1f4;
  color:#333;
  padding:20px;
}

.box{
  max-width:650px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 25px #0001;
}

h1{
  text-align:center;
  color:#9b526e;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:7px 0 15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

label{
  font-weight:bold;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#9b526e;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#result{
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  display:none;
  word-break:break-word;
}

.success{
  background:#e8f7ed;
  color:#176b35;
}

.error{
  background:#fdeaea;
  color:#a11;
}

a{
  color:#8d4560;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>🎁 لوحة تحكم الهدايا</h1>

<div id="loginBox">

<label>كلمة دخول لوحة التحكم</label>
<input id="adminPassword" type="password">

<button onclick="login()">دخول</button>

</div>

<div id="panel" style="display:none;">

<label>كود الهدية</label>
<input id="code" placeholder="مثال: ahmed01">

<label>كلمة سر العميل</label>
<input id="clientPassword" placeholder="مثال: 1234">

<label>عنوان الهدية</label>
<input id="title" placeholder="مثال: أجمل هدية ❤️">

<label>تاريخ بداية العلاقة</label>
<input id="startDate" type="datetime-local">

<label>الرسالة</label>
<textarea id="message" placeholder="اكتبي رسالة الهدية هنا"></textarea>

<label>الصور</label>
<input id="photos" type="file" accept="image/*" multiple>

<label>الأغنية</label>
<input id="audio" type="file" accept="audio/*">

<label>الفيديو</label>
<input id="video" type="file" accept="video/*">

<button id="saveBtn" onclick="saveGift()">
تجهيز الهدية 🎁
</button>

<div id="result"></div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://nuiemqobbetbpfaughik.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hJq2w7yXBvryhgpw9m1_hg_Tq4hzEBc";

const ADMIN_PASSWORD = "مريوم";


function login(){

  const password =
    document.getElementById("adminPassword").value;

  if(password === ADMIN_PASSWORD){

    document.getElementById("loginBox").style.display="none";

    document.getElementById("panel").style.display="block";

  }else{

    alert("كلمة المرور غلط");

  }
}


function showResult(message,type){

  const result =
    document.getElementById("result");

  result.style.display="block";

  result.className=type;

  result.innerHTML=message;

}


async function uploadFile(file){

  if(!file){
    return null;
  }

  const safeName =
    file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

  const path =
    "gifts/" +
    Date.now() +
    "_" +
    Math.random().toString(36).substring(2) +
    "_" +
    safeName;

  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/gift-files/" +
      path,
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":file.type || "application/octet-stream"
        },

        body:file
      }
    );

  if(!response.ok){

    const errorText =
      await response.text();

    throw new Error(
      "فشل رفع الملف: " + errorText
    );

  }

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/gift-files/" +
    path
  );
}


async function saveGift(){

  const button =
    document.getElementById("saveBtn");

  button.disabled=true;

  button.innerText="جاري الحفظ...";

  try{

    const code =
      document.getElementById("code").value.trim();

    const clientPassword =
      document.getElementById("clientPassword").value;

    const title =
      document.getElementById("title").value.trim();

    const startDate =
      document.getElementById("startDate").value;

    const message =
      document.getElementById("message").value.trim();


    if(!code){

      throw new Error("اكتبي كود الهدية");

    }

    if(!clientPassword){

      throw new Error("اكتبي كلمة سر العميل");

    }

    if(!title){

      throw new Error("اكتبي عنوان الهدية");

    }


    /*
      مهم:
      الملفات لا يتم رفعها إلا لو المستخدم
      اختار ملفات بالفعل.
    */

    let photoUrls=[];
    let audioUrl=null;
    let videoUrl=null;


    const photoFiles =
      document.getElementById("photos").files;

    const audioFile =
      document.getElementById("audio").files[0];

    const videoFile =
      document.getElementById("video").files[0];


    // رفع الصور فقط لو فيه صور
    if(photoFiles.length > 0){

      for(const file of photoFiles){

        const url =
          await uploadFile(file);

        if(url){
          photoUrls.push(url);
        }

      }

    }


    // رفع الأغنية فقط لو تم اختيار أغنية
    if(audioFile){

      audioUrl =
        await uploadFile(audioFile);

    }


    // رفع الفيديو فقط لو تم اختيار فيديو
    if(videoFile){

      videoUrl =
        await uploadFile(videoFile);

    }


    const messagesData = {

      text:message,

      photos:photoUrls,

      audio:audioUrl,

      video:videoUrl

    };


    /*
      نضع ID بأنفسنا لأن جدول gift
      عندك الـ id ليس له Default.
    */

    const giftId =
      Date.now();


    const row = {

      id:giftId,

      code:code,

      password:clientPassword,

      title:title,

      start_date:
        startDate
        ? new Date(startDate).toISOString()
        : null,

      messages:
        JSON.stringify(messagesData)

    };


    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/gift",
        {

          method:"POST",

          headers:{

            "apikey":SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(row)

        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        "فشل حفظ الهدية: " +
        errorText
      );

    }


    const siteUrl =
      "https://mariamahmed2332007-a11y.github.io/gift-site/";

    const giftLink =
      siteUrl +
      "?code=" +
      encodeURIComponent(code);


    showResult(

      "✅ تم حفظ الهدية بنجاح!<br><br>" +

      "رابط الهدية:<br>" +

      "<a href=\"" +
      giftLink +
      "\" target=\"_blank\">" +
      giftLink +
      "</a><br><br>" +

      "انسخي الرابط وابعتيه للعميل.",

      "success"

    );


  }catch(error){

    showResult(

      "❌ حصل خطأ:<br><br>" +
      error.message,

      "error"

    );

  }finally{

    button.disabled=false;

    button.innerText="تجهيز الهدية 🎁";

  }

}

</script>

</body>
  </html>
